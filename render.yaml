# CodeTogether — Render Blueprint (single web service: backend serves the built SPA)
# How to use: push this repo, then in Render choose "New > Blueprint" and point at it.
# Secrets marked `sync: false` will prompt you in the dashboard on first deploy.

services:
  - type: web
    name: code-together
    runtime: node
    plan: free
    # Root dir of the repo. Build installs deps, compiles the React app,
    # then installs backend prod-only deps.
    buildCommand: >-
      npm --prefix frontend ci --include=dev &&
      npm --prefix frontend run build &&
      npm --prefix backend ci --omit=dev
    # Start from backend/ so server.js resolves ../frontend/dist correctly.
    startCommand: cd backend && node src/server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Auto-generated strong secret (Render creates it once).
      - key: JWT_SECRET
        generateValue: secret
      # ---- Fill these in the Render dashboard (sync:false = prompt on deploy) ----
      - key: MONGO_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: STREAM_API_KEY
        sync: false
      - key: STREAM_API_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # ---- Frontend build-time values (baked into the bundle) ----
      - key: VITE_STREAM_API_KEY
        sync: false
      - key: VITE_GITHUB_CLIENT_ID
        sync: false
